# LOCAL PATCH: see `upstream_only_tests` in [features].
#
# `regions` exercises the Region / Bound multi-router topology machinery -- 126 tests, over
# eight scenario files PLUS `gossip.rs`. Every scenario links nodes to routers, builds a
# custom `gateway` region layout, or both. This fork's consumer does neither: its services
# open PEER sessions with the default layout, which find each other by multicast scouting on
# the loopback interface, autoconnect only to peers and connect to nothing else, and the
# one zenohd beside them on each host listens on loopback and connects to nothing.
#
# That is not to say none of this code is reached: regions and hats are the routing core of
# every zenoh node. A peer session gets a north peer hat and broker hats for its south and
# local regions, and a zenohd gets a north router hat, south broker and peer hats and a
# local broker hat (net/routing/gateway.rs). What we do not use is the multi-router
# scenarios, not the machinery. It is also where the suite's failures are concentrated, and
# those are `Elapsed` timeouts whose count moves run to run, so leaving it on makes a green
# run impossible to tell from a lucky one.
# LOCAL PATCH: see `upstream_only_tests` in [features].
#
# `liveliness` exercises the liveliness API, which has ZERO uses in this fork's consumer. It
# is also a member of the recurring flake class: `test_liveliness_regression_3` failed one of
# six plain runs at `liveliness.rs:3889` on `assertion failed:
# sub.try_recv().unwrap().is_none()` -- a timing-dependent ABSENCE assertion, which is a race
# by construction rather than a defect in zenoh.
[[test]]
name = "liveliness"
required-features = ["upstream_only_tests"]

[[test]]
name = "regions"
path = "tests/regions/main.rs"
required-features = ["upstream_only_tests"]

# LOCAL PATCH: see `upstream_only_tests` in [features].
#
# Every failing assertion in this target goes through `Subscriber::undeclare().wait_callbacks()`
# or a `background()` entity, and the failure is the subsequent `close()` timing out. Measured
# in the consumer: `wait_callbacks` 0 uses, `.background()` 0, `declare_querier` 0,
# `liveliness()` 0, transport/link event listeners 0 -- against declare_subscriber 59,
# declare_publisher 32 and declare_queryable 34. Plain `close()`, which is what the consumer
# calls, works: the fork's own tests close sessions and pass.
[[test]]
name = "callback_drop_on_undeclare"
path = "tests/callback_drop_on_undeclare.rs"
required-features = ["upstream_only_tests"]
