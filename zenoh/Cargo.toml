# LOCAL PATCH. Upstream test targets for zenoh features the consumer of this fork does not
# use. They are NOT deleted and NOT ignored -- they are gated, so `cargo test` here reports
# on the behaviour we rely on. Each gate below says why that target is out of scope.
#
# RUNNING them needs this feature AND whatever each target's own `#![cfg]` asks for, which
# `upstream_only_tests` alone does not supply: `regions` is `#![cfg(feature = "internal")]`
# and `callback_drop_on_undeclare` is `#![cfg(any(feature = "unstable", feature =
# "internal"))]`, so with this feature alone they compile to ZERO tests and look like they
# ran. Use the full-feature command in FORK.md, which supplies both.
upstream_only_tests = []

