[package]
authors = { workspace = true }
categories = { workspace = true }
description = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
name = "zenohd"
readme = "README.md"
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# SHARED MEMORY IS ON BY DEFAULT IN THIS FORK (hecate, 2026-11-16).
#
# Upstream leaves it opt-in, so a plain `cargo install zenohd` produces a
# router with NO shared-memory support. zenoh's own docs are explicit that
# "shared memory needs to be enabled also on the subscriber side" or the session
# falls back to network, so a relay without it ends shared memory at that hop.
#
# zenohd is not on the path of the consumer's own traffic: its services open
# PEER sessions that name no connect endpoint and autoconnect only to peers, so
# none links to the router (BER-2085). Whether zenohd needs shared memory at all
# is an open question; it stays enabled because disabling it is the change that
# would need measuring.
#
# Measured 2026-11-16, when those services still ran in client mode through
# zenohd: the installed `zenohd` had ZERO shared-memory symbols while every
# hecate2 service binary had them, because the consumer's workspace pins `zenoh`
# with `shared-memory` and a plain zenohd build did not enable it. So
# `shm = true` in the shipped configs was inert -- the capable end was talking to
# an incapable one.
#
# Defaulting it on removes a silent, install-flag-dependent failure. It only
# ENABLES the capability: zenoh still gates actual use on its own
# `message_size_threshold` (3072 B by default), so nothing changes for the
# payloads below that.
default = ["zenoh/default", "shared-memory"]
shared-memory = ["zenoh/shared-memory"]

[dependencies]
clap = { workspace = true, features = ["derive"] }
git-version = { workspace = true }
json5 = { workspace = true }
lazy_static = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zenoh = { workspace = true, default-features = false, features = [
  "internal",
  "plugins",
  "runtime_plugins",
  "unstable",
] }
zenoh-config = { workspace = true }
zenoh-util = { workspace = true }

[dev-dependencies]
rand = { workspace = true, features = ["default"] }
# LOCAL PATCH: `tests/` runs this package's own binary, `CARGO_BIN_EXE_zenohd`, as the
# router in a test's private scouting group (BER-2469).
zenoh-test = { workspace = true, features = ["sessions"] }

[build-dependencies]
rustc_version = { workspace = true }

[package.metadata.deb]
assets = [
  # binary
  { source = "target/release/zenohd", dest = "/usr/bin/", mode = "755" },
  # config
  { source = ".service/zenohd.json5", dest = "/etc/zenohd/", mode = "644" },
  # service
  { source = ".service/zenohd.service", dest = "/lib/systemd/system/zenohd.service", mode = "644" },
]
copyright = "2024 ZettaScale Technology"
depends = "$auto"
license-file = ["../LICENSE", "0"]
maintainer = "zenoh-dev@eclipse.org"
maintainer-scripts = ".deb"
name = "zenohd"
section = "net"
