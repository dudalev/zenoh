[package]
authors = { workspace = true }
categories = { workspace = true }
description = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
name = "zenohd"
readme = "README.md"
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# SHARED MEMORY IS ON BY DEFAULT IN THIS FORK (hecate, 2026-11-16).
#
# Upstream leaves it opt-in, so a plain `cargo install zenohd` produces a
# router with NO shared-memory support. zenoh's own docs are explicit that
# "shared memory needs to be enabled also on the subscriber side" or the session
# falls back to network, so a relay without it ends shared memory at that hop.
#
# NOTE, corrected 2026-11-18: this previously said every hecate2 service runs in
# CLIENT mode, which made the router a relay on EVERY hop. That is no longer
# true -- services run in PEER mode and BER-2085 restricted their multicast
# autoconnect to `peer`, so they no longer link to the router at all. zenohd
# still holds a residual set of sessions (measured: it dropped from 63.7% of a
# core to about 10%, not to idle), so the feature is not useless, but it is no
# longer on the path of ordinary service-to-service traffic. Whether zenohd
# needs shared memory at all is now an open question rather than a settled
# requirement; it is left enabled because disabling it is the change that would
# need measuring
# mode.
#
# Measured 2026-11-16: the installed `zenohd` had ZERO shared-memory symbols
# while every hecate2 service binary had them, because the workspace pins
# `zenoh` with `features = ["transport_tcp", "shared-memory"]`. So `shm = true`
# in all 41 shipped configs was inert -- the capable end was talking to an
# incapable one.
#
# Defaulting it on removes a silent, install-flag-dependent failure. It only
# ENABLES the capability: zenoh still gates actual use on its own
# `message_size_threshold` (3072 B by default), so nothing changes for the
# payloads below that.
default = ["zenoh/default", "shared-memory"]
shared-memory = ["zenoh/shared-memory"]

[dependencies]
clap = { workspace = true, features = ["derive"] }
git-version = { workspace = true }
json5 = { workspace = true }
lazy_static = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zenoh = { workspace = true, default-features = false, features = [
  "internal",
  "plugins",
  "runtime_plugins",
  "unstable",
] }
zenoh-config = { workspace = true }
zenoh-util = { workspace = true }

[dev-dependencies]
rand = { workspace = true, features = ["default"] }

[build-dependencies]
rustc_version = { workspace = true }

[package.metadata.deb]
assets = [
  # binary
  { source = "target/release/zenohd", dest = "/usr/bin/", mode = "755" },
  # config
  { source = ".service/zenohd.json5", dest = "/etc/zenohd/", mode = "644" },
  # service
  { source = ".service/zenohd.service", dest = "/lib/systemd/system/zenohd.service", mode = "644" },
]
copyright = "2024 ZettaScale Technology"
depends = "$auto"
license-file = ["../LICENSE", "0"]
maintainer = "zenoh-dev@eclipse.org"
maintainer-scripts = ".deb"
name = "zenohd"
section = "net"
